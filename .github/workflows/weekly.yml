name: Luxury Radar - Weekly e-mail

on:
  schedule:
    # Mondays 07:30 UTC, after the daily run
    - cron: '30 7 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Do not send the e-mail"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: luxury-radar
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send the weekly e-mail
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          DASHBOARD_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          args=""
          if [ "$DRY_RUN" = "true" ]; then args="--dry-run"; fi
          python weekly_report.py $args
