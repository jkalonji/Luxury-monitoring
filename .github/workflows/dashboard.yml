name: Luxury Radar - Dashboard only

# Rebuilds and publishes the dashboard from the stored data, without collecting anything.
on:
  workflow_dispatch:
    inputs:
      days:
        description: "Analysis window (days)"
        required: false
        default: '30'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: luxury-radar
  cancel-in-progress: false

jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate dashboard
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DAYS: ${{ github.event.inputs.days || '30' }}
        run: |
          mkdir -p site
          python dashboard.py --export --days "$DAYS" --output site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
